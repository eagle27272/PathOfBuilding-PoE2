# cspell:ignore simplegraphic SIMPLEGRAPHIC
name: Update SimpleGraphic runtime
on:
    workflow_dispatch:
        inputs:
            simplegraphic_tag:
                description: SimpleGraphic release tag to import
                required: true
            simplegraphic_release_repo:
                description: SimpleGraphic release repository
                required: false
                default: ''
            simplegraphic_release_link:
                description: SimpleGraphic release URL for the pull request body
                required: false
                default: ''
            runtime_index:
                description: SimpleGraphic runtime index asset name
                required: false
                default: SimpleGraphicRuntime-index.json
            launcher_tag:
                description: Optional PathOfBuilding-PoE2 launcher runtime release tag
                required: false
                default: ''
            launcher_release_repo:
                description: Optional launcher runtime release repository
                required: false
                default: ''
            launcher_runtime_index:
                description: Optional launcher runtime index asset name
                required: false
                default: PathOfBuildingRuntime-index.json
    repository_dispatch:
        types: [update-simple-graphic]
jobs:
    update:
        runs-on: ubuntu-24.04
        env:
            SIMPLEGRAPHIC_RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.simplegraphic_tag }}
            SIMPLEGRAPHIC_RELEASE_REPO: ${{ github.event.client_payload.release_repo || inputs.simplegraphic_release_repo || 'eagle27272/PathOfBuilding-SimpleGraphic' }}
            SIMPLEGRAPHIC_RELEASE_LINK: ${{ github.event.client_payload.release_link || inputs.simplegraphic_release_link || format('https://github.com/{0}/releases/tag/{1}', github.event.client_payload.release_repo || inputs.simplegraphic_release_repo || 'eagle27272/PathOfBuilding-SimpleGraphic', github.event.client_payload.tag || inputs.simplegraphic_tag) }}
            SIMPLEGRAPHIC_RUNTIME_INDEX: ${{ github.event.client_payload.runtime_index || inputs.runtime_index || 'SimpleGraphicRuntime-index.json' }}
            POB_RUNTIME_RELEASE_TAG: ${{ github.event.client_payload.launcher_tag || inputs.launcher_tag || '' }}
            POB_RUNTIME_RELEASE_REPO: ${{ github.event.client_payload.launcher_release_repo || inputs.launcher_release_repo || github.repository }}
            POB_RUNTIME_INDEX: ${{ github.event.client_payload.launcher_runtime_index || inputs.launcher_runtime_index || 'PathOfBuildingRuntime-index.json' }}
        steps:
            - name: Set line endings
              run: git config --global core.autocrlf true
            - name: Checkout
              uses: actions/checkout@v4
              with:
                ref: 'dev'
            - name: Download runtime archives
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                set -eu
                mkdir -p runtime-assets
                gh release download "$SIMPLEGRAPHIC_RELEASE_TAG" --repo "$SIMPLEGRAPHIC_RELEASE_REPO" --pattern "$SIMPLEGRAPHIC_RUNTIME_INDEX" --dir runtime-assets --clobber
                gh release download "$SIMPLEGRAPHIC_RELEASE_TAG" --repo "$SIMPLEGRAPHIC_RELEASE_REPO" --pattern 'SimpleGraphicDLLs-x64-windows.tar' --dir runtime-assets --clobber || true
                gh release download "$SIMPLEGRAPHIC_RELEASE_TAG" --repo "$SIMPLEGRAPHIC_RELEASE_REPO" --pattern 'SimpleGraphicRuntime-*.tar' --dir runtime-assets --clobber || true
                gh release download "$SIMPLEGRAPHIC_RELEASE_TAG" --repo "$SIMPLEGRAPHIC_RELEASE_REPO" --pattern 'SimpleGraphicRuntime-*.tar.gz' --dir runtime-assets --clobber || true
                gh release download "$SIMPLEGRAPHIC_RELEASE_TAG" --repo "$SIMPLEGRAPHIC_RELEASE_REPO" --pattern 'SimpleGraphicRuntime-*.tgz' --dir runtime-assets --clobber || true
                if [ -n "$POB_RUNTIME_RELEASE_TAG" ]; then
                  gh release download "$POB_RUNTIME_RELEASE_TAG" --repo "$POB_RUNTIME_RELEASE_REPO" --pattern "$POB_RUNTIME_INDEX" --dir runtime-assets --clobber
                  gh release download "$POB_RUNTIME_RELEASE_TAG" --repo "$POB_RUNTIME_RELEASE_REPO" --pattern 'PathOfBuildingRuntime-*.tar' --dir runtime-assets --clobber || true
                  gh release download "$POB_RUNTIME_RELEASE_TAG" --repo "$POB_RUNTIME_RELEASE_REPO" --pattern 'PathOfBuildingRuntime-*.tar.gz' --dir runtime-assets --clobber || true
                  gh release download "$POB_RUNTIME_RELEASE_TAG" --repo "$POB_RUNTIME_RELEASE_REPO" --pattern 'PathOfBuildingRuntime-*.tgz' --dir runtime-assets --clobber || true
                fi
            - name: Install runtime archives
              run: scripts/import-simplegraphic-runtime.sh runtime-assets
            - name: Create Pull Request
              uses: peter-evans/create-pull-request@v7
              with:
                title: Update SimpleGraphic runtime to ${{ env.SIMPLEGRAPHIC_RELEASE_TAG }}
                branch: simple-graphic-${{ env.SIMPLEGRAPHIC_RELEASE_TAG }}
                body: |
                    Update SimpleGraphic runtime files to SimpleGraphic-${{ env.SIMPLEGRAPHIC_RELEASE_TAG }} from ${{ env.SIMPLEGRAPHIC_RELEASE_LINK }}
                commit-message: Update SimpleGraphic runtime to ${{ env.SIMPLEGRAPHIC_RELEASE_TAG }}
              
